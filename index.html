<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — To-Do List</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:light-dark(#f5f7fb,#10131a);--card:light-dark(#fff,#171b24);--text:light-dark(#172033,#f5f7fb);--muted:light-dark(#68738a,#9da7ba);--line:light-dark(#e5e9f0,#2b3240);--primary:light-dark(#4f46e5,#818cf8);--primary2:light-dark(#4338ca,#6366f1);--danger:light-dark(#dc2626,#f87171);--soft:light-dark(#eef2ff,#22263b)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}.app{min-height:100vh;background:var(--bg);padding:32px 18px}.wrap{max-width:820px;margin:auto}.header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--primary)}h1{font-size:clamp(32px,6vw,52px);line-height:1;margin:7px 0 10px;letter-spacing:-.04em}.sub{color:var(--muted);margin:0}.count{padding:10px 14px;border:1px solid var(--line);border-radius:999px;font-weight:700;background:var(--card)}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 16px 40px #00000012}.form{display:grid;grid-template-columns:1fr auto;gap:10px}.input{width:100%;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:14px;padding:15px 16px;font-size:16px;outline:none}.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px #6366f122}button{border:0;cursor:pointer;font:inherit}.add{padding:0 22px;border-radius:14px;background:var(--primary);color:white;font-weight:800}.add:hover{background:var(--primary2)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 14px;flex-wrap:wrap}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{padding:9px 13px;border-radius:10px;background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:700}.filter.active{background:var(--soft);color:var(--primary);border-color:#818cf855}.clear{color:var(--danger);background:transparent;font-weight:800}.list{display:grid;gap:10px}.empty{text-align:center;padding:44px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.task{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:16px;transition:.18s}.task:hover{transform:translateY(-1px);box-shadow:0 8px 20px #0000000c}.check{width:22px;height:22px;border:2px solid var(--line);border-radius:7px;background:transparent;display:grid;place-items:center;color:white}.task.done .check{background:var(--primary);border-color:var(--primary)}.check span{font-size:14px;line-height:1;display:none}.task.done .check span{display:block}.task-title{font-weight:700;word-break:break-word}.task.done .task-title{text-decoration:line-through;color:var(--muted)}.actions{display:flex;gap:6px}.icon{width:34px;height:34px;border-radius:9px;background:transparent;color:var(--muted);border:1px solid transparent}.icon:hover{background:var(--soft);color:var(--text)}.footer{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:18px}.tip{margin-top:20px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:560px){.app{padding:22px 12px}.header{align-items:start;flex-direction:column}.form{grid-template-columns:1fr}.add{height:50px}.card{padding:15px;border-radius:20px}.task{grid-template-columns:auto 1fr}.actions{grid-column:2}.footer{flex-direction:column;gap:5px}}
</style>
</head>
<body>
<div class="app"><main class="wrap">
<header class="header"><div><div class="eyebrow">JavaScript • State Management</div><h1>TaskFlow</h1><p class="sub">A simple, persistent to-do manager.</p></div><div class="count" id="count">0 tasks</div></header>
<section class="card">
<form class="form" id="taskForm"><input class="input" id="taskInput" maxlength="120" autocomplete="off" placeholder="What needs to be done?" aria-label="New task"><button class="add" type="submit">+ Add Task</button></form>
<div class="toolbar"><div class="filters" role="group" aria-label="Task filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="active">Active</button><button class="filter" data-filter="completed">Completed</button></div><button class="clear" id="clearCompleted">Clear completed</button></div>
<div class="list" id="taskList"></div>
<div class="footer"><span id="remaining">0 active</span><span>Saved automatically in your browser</span></div>
</section><div class="tip">Add, edit, complete, filter, and delete tasks — your data stays after refresh.</div>
</main></div>
<script>
const STORAGE_KEY='taskflow_tasks_v1';
let tasks=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
let filter='all';
const list=document.getElementById('taskList'), input=document.getElementById('taskInput'), count=document.getElementById('count'), remaining=document.getElementById('remaining');
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks));}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function visible(){return tasks.filter(t=>filter==='all'||(filter==='active'&&!t.done)||(filter==='completed'&&t.done));}
function render(){
 const items=visible();
 list.innerHTML=items.length?items.map(t=>`<article class="task ${t.done?'done':''}" data-id="${t.id}"><button class="check" data-action="toggle" aria-label="Toggle task"><span>✓</span></button><div class="task-title">${escapeHtml(t.title)}</div><div class="actions"><button class="icon" data-action="edit" aria-label="Edit task">✎</button><button class="icon" data-action="delete" aria-label="Delete task">×</button></div></article>`).join(''):`<div class="empty">${filter==='all'?'No tasks yet. Add your first task above.':filter==='active'?'No active tasks.':'No completed tasks.'}</div>`;
 const active=tasks.filter(t=>!t.done).length; count.textContent=`${tasks.length} ${tasks.length===1?'task':'tasks'}`; remaining.textContent=`${active} active`;
 document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));
}
document.getElementById('taskForm').addEventListener('submit',e=>{e.preventDefault();const title=input.value.trim();if(!title)return;tasks.unshift({id:Date.now().toString(),title,done:false});input.value='';save();render();input.focus();});
document.querySelector('.filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;render();});
list.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const row=e.target.closest('.task'),id=row.dataset.id,t=tasks.find(x=>x.id===id);if(!t)return;const action=btn.dataset.action;if(action==='toggle')t.done=!t.done;if(action==='delete')tasks=tasks.filter(x=>x.id!==id);if(action==='edit'){const next=prompt('Edit task:',t.title);if(next!==null&&next.trim())t.title=next.trim();}save();render();});
document.getElementById('clearCompleted').addEventListener('click',()=>{tasks=tasks.filter(t=>!t.done);save();render();});
render();
</script>
</body></html>
